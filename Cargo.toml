[package]
name = "frinux"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "frinux"
test = false
bench = false

[dependencies]
critical-section = { version = "1.2.0", features = ["restore-state-bool"] }
heapless = "0.9.2"
riscv = { version = "0.16.0", features = ["s-mode"] }
rvdc = "0.1.1"
sbi = "0.3.0"
spin = "0.10.0"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
